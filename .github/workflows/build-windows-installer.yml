name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained win-x64 app
        run: |
          dotnet publish src/BiliGamePiP/BiliGamePiP.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish/win-x64

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Setup .exe with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/BiliGamePiP.iss
          Get-ChildItem dist

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliGamePiP-Windows-Installer
          path: dist/BiliGamePiP-Setup-*.exe
          if-no-files-found: error

      - name: Create GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BiliGamePiP-Setup-*.exe
